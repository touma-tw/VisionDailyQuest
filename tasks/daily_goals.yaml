# Agentic 版每日任務清單。
#
# 和舊的 daily.yaml(workflow 版,寫死每一步)完全不同:
# 這裡只給「遊戲知識」和「高層目標」,實際怎麼操作由 agent 自己看畫面規劃。
# 執行:  python -m agent.pilot          跑整套
#        python -m agent.pilot 星辰試煉  只跑一個
#
# 寫法原則:
#   - game_knowledge = 這遊戲怎麼運作、有哪些陷阱(所有任務共用,注入每個 agent)。是「知識」不是「步驟」。
#   - 每個 task 的 goal = 要達成什麼、從哪進入、怎麼判斷做不做。不要寫「點左上角第幾個」這種死步驟。
#   - 新任務(全域推演、共攬星碑…)只要加一段 goal,必要時往 game_knowledge 補該活動的知識。

game_knowledge: |
  【主要畫面】
  - 「大廳」是遊戲主基地:畫面下方一排按鈕(角色/倉庫/邂逅/商店/心之羈絆/天賦/遠航),
    最右下角「出航」,右側有「頻道」「告示板」,左上角是玩家頭像。迷路時一直點返回箭頭就能退回大廳。
  - 大廳上排有 6 個圓形圖示,**圖示上沒有文字**,由左到右:好友(人像)、信箱(信封)、公告(鈴鐺)、
    官網(燒瓶)、**任務(獎盃)**、戰報(交叉的劍)。要點「任務」就找**獎盃圖示**——
    畫面上沒有「任務」兩個字,用名稱去點會點到隔壁的戰報。
  - 「交錯的世界」在:大廳點右下角「出航」→ 點「交錯的世界」。
    進去後**上方有三個分頁:「日常活動」「限時活動」「常駐活動」**,每日要做的活動卡片
    (塔羅遺力、神兵試煉、記憶尋回、實戰訓練、進階試煉、星辰試煉、光輝鍛鑄…)全都在**「日常活動」**這個分頁裡,
    是一排可左右捲動的直式卡片(由左到右大致是塔羅遺力→神兵試煉→記憶尋回→實戰訓練→進階試煉→星辰試煉→光輝鍛鑄→…),
    左下角有「代行記錄」。**若你看到的是「歸來的鈴蘭」之類的大圖,代表跑到「常駐活動」分頁了,先點上方「日常活動」切回來。**
    卡片在右側(星辰試煉、光輝鍛鑄)要用 swipe right 往右捲幾次才看得到;塔羅遺力在最左邊,要 swipe left。
  - **注意這裡有兩層、別搞混**:「出航」頁本身只有三張大卡 ——「交錯的世界」「愚者的旅程」「命運的螺旋」;
    上面那些活動卡片(塔羅遺力、記憶尋回、星辰試煉…)要**點進「交錯的世界」之後**才會出現。
    所以如果你看到的是「愚者的旅程」「命運的螺旋」,代表你還停在出航頁 —— 先點「交錯的世界」進去,
    不要在出航頁一直左右捲找活動卡(找不到的)。

  【存在之力】右上角閃電符號旁的數字(如 165/240)。上限 240,可累積超過(超過的部分會隨時間浪費),
    每 4 分鐘自然恢復 1 點。很多活動要消耗它。

  【卡片上的次數標示】不統一,看清楚:記憶尋回、神兵試煉 標「剩餘次數 N」;
    塔羅遺力、光輝鍛鑄、星辰試煉、實戰訓練、進階試煉 標「高額獎勵 N」。N=0 通常代表今天已做完。

  【代行流程與陷阱 —— 很重要】活動關卡頁右下角有兩顆並排按鈕,都標「⚡40」或「⚡30」:
    「代行」= 直接跳過戰鬥領獎勵(這些活動都用代行);「出擊」= 進手動戰棋盤面,進去就出不來,**絕不要點**。
    點代行時描述要精確(例如「右下角標著⚡40的『代行』按鈕」),別和左下角的「代行記錄」搞混。
    點代行後會跳彈窗「是否消耗章魚罐頭讓代行立刻完成」:選「繼續代行」(旁邊沒有費用標示那顆),
    不要選使用章魚罐頭。
    **接著會出現一個「確認出戰陣容」的角色畫面(右側已經幫你選好角色,例如顯示 5/5 或 4/4)** ——
    這是代行流程正常的一步,不是手動戰鬥!**直接點右下角的「確認」,代行就會跳過戰鬥、直接顯示「XXX完成」的結算。
    千萬不要因為看到選角畫面就以為誤入手動戰鬥而退出**(這樣會一直卡在代行進不去)。
    (若那個畫面提示「需要 N 名角色達到某階級」而右側湊不滿人數,才是真的打不了,這時才退出、換別的關卡或放棄。)
    代行做完的**結算畫面下方另有一顆「繼續代行 ⚡40」(帶閃電費用)**,那是「再做一次、再花體力」,
    不要點;要離開結算就點左上角返回箭頭(或右側空白處)。

  【絕對禁止】不要使用任何道具、不要花費任何貨幣去補體力或換次數。
    若跳出「體力不足要不要用藥水/購買補充」之類彈窗,關掉它、放棄該任務,不要按下去。
    (注意:代行前那個「章魚罐頭」彈窗是正常流程,選「繼續代行」不用道具即可,不算違規。)

  【戰鬥 —— 很重要】有些活動是真的打一場戰鬥(不是代行)。戰鬥畫面**最上排由左到右**是:
    一個「☰ 三條線的選單圖示」、然後「手動」按鈕、然後「加速」按鈕、然後一個回合數(沙漏)。
    - **要切自動,點的是「手動」那顆按鈕(點下去會變成「自動」)**,不是它左邊那個 ☰ 選單圖示。
      **千萬不要點左上角那個 ☰ 選單圖示** —— 那會打開暫停選單,裡面有「退出戰鬥」,一不小心就放棄了整場。
    - **絕對不要碰「加速」按鈕** —— 遊戲速度已經預先設定在加速 2 級(最快)了,不用你加速。
      而且加速鈕是「循環切換」的:你一點它,反而會從最快跳回最慢速,越點越慢。
      切成「自動」後,**其他什麼都不要點,直接用 wait 一直等**,直到出現「戰鬥勝利/戰鬥結束」的結算。
    - **絕對不要點「退出戰鬥」/「放棄挑戰」** —— 那會白白浪費這次的次數和存在之力。
      萬一跳出「是否放棄挑戰」的彈窗,點「取消」留在戰鬥裡,別點「確定」。

tasks:
  - name: 好友
    max_steps: 10
    goal: |
      領取與贈送聲望之證。
      在大廳點「上排的好友圖示」進入好友頁,點右上角「全部領取」一次,接著點「一鍵贈送」。
      **判斷:**
      - 若字體由白色變成灰色代表已經完成。
      - 若點了「全部領取」畫面**沒有反應** 或是字體已經是灰色 → 代表今天已經領過了(這很正常),
        這也算完成 —— 直接回大廳回報 finish。
      **重點:「沒反應」就是「已領過」,不要因此反覆重點「全部領取」、
      也不要退出後又重新進任務頁確認。點過一次沒反應,就當作完成收工。**
      完成後退回到大廳。
  - name: 領每日體力
    max_steps: 15
    goal: |
      領取每天額外的存在之力(早上 8:00 後、下午 16:00 後各可領一次 60 點)。
      在大廳點「上排的獎盃圖示」進入任務頁,點右上角「全部領取」一次。
      **接著判斷:**
      - 若跳出領取獎勵的彈窗/動畫 → 領到了,關掉彈窗,回大廳,完成。
      - 若點了「全部領取」畫面**沒有反應** → 代表今天已經領過了(這很正常),
        這也算完成 —— 直接回大廳回報 finish。
      **重點:「沒反應」就是「已領過」,不要因此反覆重點「全部領取」、
      也不要退出後又重新進任務頁確認。點過一次沒反應,就當作完成收工。**

  - name: 遠航
    max_steps: 50
    goal: |
      在大廳點下方的「遠航」,把今天的遠航事務做完。依序檢查下面三件事,
      **每件事只做一次,已經做過的就跳過,不要反覆回頭確認同一件:**
      (1) 收穫與派遣:若畫面有「全部收穫」就點它收穫已到達的隊伍;收穫後那顆會變「一鍵派遣」,
          點它把隊伍派出去。**若「一鍵派遣」點了沒反應、或右側顯示「暫無遠航隊伍」,
          代表今天已經派過了 —— 這項就算做完,跳過。**
          (絕不要點旁邊單獨那顆「派遣」,那是手動派遣要花星石。)
      (2) 日常:若左下角「日常」有橘色亮燈就點進去領獎勵;沒亮燈就跳過。
      (3) 兌換:點左下角「兌換」進入兌換頁(左側會出現「商店」「交易行」兩個分頁)。
          進到兌換頁之後,**直接呼叫 `exchange` 工具**,它會自動把整個交易行的每日兌換做完
          (切到交易行分頁、捲到頂兌最頂端大項、捲到底兌最底端各項)。
          **你不要自己手動切分頁、捲動、或逐顆點兌換** —— 那些判斷(在哪個分頁、有沒有捲到頂/底)
          交給 exchange 工具做,比你自己看畫面判斷準得多。呼叫一次 exchange、看它回報完成,兌換這項就做完了。
      這三項各做過一次之後,遠航就做完了,回到大廳回報 finish。
      **關鍵:每一項確認過(已派/已兌完/沒亮燈)就是做完了,別再回頭重看 ——
      在「派遣↔兌換」之間來回只是在原地繞圈,看到都做完了就直接 finish。**

  - name: 星海開拓
    max_steps: 30
    goal: |
      在大廳點右側「告示板」→ 點「開拓征程」→ 點「星海開拓」,進去點左側的寶箱圖案,
      點「領取」領獎勵(有收穫彈窗就關掉)。這個每天領一次就足夠了,不要一直重複領,做完一路返回回到大廳。

  - name: 記憶尋回
    max_steps: 40
    goal: |
      在「交錯的世界」做「記憶尋回」。先看記憶尋回卡片的「剩餘次數」:若為 0 就今天做完了,直接完成。
      若不為 0:點進記憶尋回,往右捲到最右邊的關卡點進去(關卡 6),點「出擊」→「開始」進入戰鬥,
      把左上角「手動」切成「自動」,等戰鬥打完(出現「戰鬥勝利」),點它回到選單。做完回到交錯的世界選單。

  - name: 塔羅遺力
    max_steps: 40
    goal: |
      在「交錯的世界」做「塔羅遺力」的代行。塔羅遺力卡片在選單最左邊(看不到往左捲)。
      先看它的「高額獎勵」數字:若為 0 表示今天做完了,不用做,直接完成。
      若不為 0:點進塔羅遺力,依今天星期幾選關卡(週一/週四→塔羅遺力1;週二/週五→塔羅遺力2;
      週三/週六→塔羅遺力3;週日→塔羅遺力4),用代行完成一次。做完回到交錯的世界選單。

  - name: 光輝鍛鑄
    max_steps: 40
    goal: |
      在「交錯的世界」做「光輝鍛鑄」的代行。光輝鍛鑄卡片在選單右側(看不到往右捲)。
      先看它的「高額獎勵」數字:若為 0 就今天做完了,不用做,直接完成。
      若不為 0:點進去,用代行完成一次。做完回到交錯的世界選單。

  - name: 領任務獎勵
    max_steps: 15
    goal: |
      領取今天累積的每日任務獎勵。在大廳點「上排的獎盃圖示」進任務頁,點「全部領取」
      (有收穫彈窗就關掉),然後回到大廳。

  - name: pvp
    max_steps: 80
    goal: |
      做「榮耀之戰」的每日挑戰。在大廳點右側「告示板」→ 點「榮耀之戰」。
      看上方的「挑戰次數」:只要不為 0,就點「簡單」難度下方的雙劍符號 →「開始」進入戰鬥,
      把左上角「手動」切成「自動」,等打完(出現「戰鬥結束」),關掉結算。重複直到挑戰次數變成 0。
      次數用完後,在榮耀之戰頁面點右下角的「任務」領取獎勵。做完回到大廳。

  # ⚠ 星辰試煉一定要排在最後:它會把剩下的存在之力全部燒掉,排在別的耗體力任務(記憶尋回、
  #   塔羅遺力、光輝鍛鑄)前面的話,那些就沒體力做了。它的用途就是消化「剩餘」的存在之力。
  - name: 星辰試煉
    max_steps: 90
    goal: |
      用「星辰試煉」的代行,把「到午夜前會溢出而浪費」的存在之力燒掉(高額獎勵為 0 也照做,做它就是為了消耗體力)。
      這是今天最後一個任務,前面該用體力的任務都做完了。

      **不要自己算時間、也不要一次算出總共要做幾次**(那個算不出來會卡死)。改成「做一次→讀一次→判斷一次」的循環:
      已知:存在之力上限 240,每做一次代行消耗 40 點;午夜前還會恢復的量叫 R(本次任務開頭那句「還會自然恢復約 __ 點」就是 R,整個任務都用同一個 R,不要重算)。
      每一次(包含最開始),用 read 讀「右上角的存在之力 P(格式 P/240)」,然後只做這一個判斷:
        ‧ 若 P + R > 240(代表到午夜還是會滿出來、還有得燒) 而且 P ≥ 40(現在做得起) → 再做一次代行。
        ‧ 否則(P + R ≤ 240 不會再溢出,或 P < 40 做不起了) → 立刻 finish,回報一共做了幾次。
      算例:假設 R=219。P=160 → 160+219=379>240 且 160≥40 → 做一次;做完再讀 P≈120 → 120+219>240 → 再做;
            …一直到 P 降到約 21(21+219=240)或不足 40 為止就 finish。(P+R 只是一次加法一次比大小,別想複雜。)

      操作:星辰試煉卡片在交錯的世界選單右側(用 swipe right 捲過去);點進它的關卡頁,右上角才看得到存在之力 P。
      高額獎勵不為 0 就打當天高額試煉,為 0 就隨便選星辰試煉 1/2/3。每做完一次代行,回到關卡頁讀一次 P 再判斷。做完回到交錯的世界選單。
